result:
  title: Calculation Result
  modes:
    expected: Expected Damage
    stability: Damage Range
    stability-with-graze: Damage Range (Graze)
  modes-caption:
    expected: Expected damage calculated considering critical rate, accuracy, and stability.
    stability: Shows the maximum and minimum possible damage. Max is critical max damage, min is non-critical with lowest stability.
    stability-with-graze: Similar to Damage Range, but the minimum value also considers Graze.
calc-mode:
  title: Interface Formula
  caption: You can select the calculation formula displayed on the interface. This only affects the display, not the configurable items or the calculation result.
  modes:
    common: Basic Formula
    critical: Critical Formula
  modes-caption:
    common: Basic damage formula. Suitable for most calculation scenarios.
    critical: Damage formula on critical hit, mainly used to display "Two-Handed" in the formula. Shows damage upon critical, some items are outside the formula.
